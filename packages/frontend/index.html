<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101114" />
    <title>Valve IDE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      // SPA redirect for GitHub Pages
      (function () {
        var pathSegmentsToKeep = 1; // For /Valve/ repository
        var l = window.location;
        if (l.search) {
          var q = l.search.slice(1).split('&');
          var redirect = q.find(function (param) { return param.startsWith('/') });
          if (redirect) {
            l.replace(
              l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
              l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/' +
              redirect.replace(/^./, '').replace(/~and~/g, '&') +
              (l.hash ? '#' + l.hash.slice(1).replace(/~and~/g, '&') : '')
            );
          }
        }
      }());
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
